services:
  - type: web
    name: labledger-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: labledger-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: labledger-cache
          property: connectionString
      - key: WRITE_TOKEN
        generateValue: true

  - type: keyvalue
    name: labledger-cache
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: labledger
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:registry
    staticPublishPath: dist/registry
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: VITE_API_URL
        value: https://labledger-api-h8zu.onrender.com

  - type: web
    name: fieldsense
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:field
    staticPublishPath: dist/field
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: VITE_API_URL
        value: https://labledger-api-h8zu.onrender.com
      - key: VITE_REGISTRY_URL
        value: https://labledger-az0y.onrender.com

databases:
  - name: labledger-db
    plan: free
    databaseName: labledger
    user: labledger
